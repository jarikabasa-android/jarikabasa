<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HO RADIO TV - JarikaBASA Digital Zone</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .radio-container {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 204, 0, 0.4);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #ffcc00;
        }
        .subtitle {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 15px;
        }
        .status-badge {
            display: inline-block;
            background: #2ed573;
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .now-playing {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #fffa65;
        }
        audio {
            width: 100%;
            margin-bottom: 15px;
            outline: none;
            border-radius: 30px;
        }
        .footer-text {
            font-size: 11px;
            color: #888;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 12px;
        }
    </style>
</head>
<body>

    <div class="radio-container">
        <h1>📺 HO RADIO TV</h1>
        <div class="subtitle">सारजामदा से हो भाषा और संस्कृति का लाइव प्रसारण</div>
        
        <div class="status-badge">● 24/7 LIVE STREAM</div>

        <div class="now-playing" id="songTitle">
            ♪ बज रहा है: Ho Folk & Cultural Audio Stream
        </div>

        <!-- GitHub Audio Streamer -->
        <audio id="radioAudio" controls autoplay loop>
            <!-- यहाँ अपनी GitHub पर अपलोड की गई MP3 फाइल का Raw Link डालें -->
            <source src="APKA_GITHUB_RAW_MP3_LINK_YAHAN_DALEN" type="audio/mpeg">
            आपका ब्राउज़र ऑडियो प्लेयर को सपोर्ट नहीं करता है।
        </audio>

        <div class="footer-text">JarikaBASA Digital Zone • All Rights Reserved</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            var audio = document.getElementById('radioAudio');
            audio.play().catch(function(error) {
                console.log("Autoplay restricted by browser.");
            });
        });
    </script>

</body>
</html>
